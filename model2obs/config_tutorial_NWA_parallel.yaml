# ==========================================
# model2obs Configuration for the North West Atlantic tutorial (parallel)
# ==========================================
# Model-observation comparison between a MOM6 NWA12 run (4 daily snapshots,
# 2010-05-01 to 2010-05-04, split across NWA12_demo_01_p1.nc and
# NWA12_demo_01_p2.nc) and CrocoLake observations already in obs_seq format.
# Run with parallel=True, one worker thread per model file.
# Structure follows config_templates/config_template_MOM6.yaml.
#
# NOTE: Paths below are relative to $TUTORIAL_DATA_PATH, the tutorial data folder
# set by install/envpaths*.sh. On NCAR HPC systems install_NCAR.sh populates it
# from the shared campaign dataset via install/tutorials_setup_NCAR.sh; elsewhere
# install.sh downloads it from Zenodo via install/tutorials_download.sh. If
# running somewhere else, either export TUTORIAL_DATA_PATH to your own copy of
# the data or edit the paths below.

# Ocean model to use (required)
# Supported values: MOM6, ROMS_Rutgers
ocean_model: MOM6

####### INPUT FILES #######
# Directory containing model .nc files to process
model_files_folder: $TUTORIAL_DATA_PATH/tutorial_NW_atlantic_parallel/in_mom6/

# Model configuration files (must be .nc files)
template_file: $TUTORIAL_DATA_PATH/tutorial_NW_atlantic_parallel/in_mom6/NWA12_demo_01_p1.nc
static_file: $TUTORIAL_DATA_PATH/tutorial_NW_atlantic_parallel/in_mom6_ref/NWA12_demo_static.nc
ocean_geometry:  $TUTORIAL_DATA_PATH/tutorial_NW_atlantic_parallel/in_mom6_ref/NWA12_demo_ocean_geometry.nc

# Directory containing observation files
obs_seq_in_folder: $TUTORIAL_DATA_PATH/tutorial_NW_atlantic_parallel/in_CrocoLake/

####### OUTPUT FILES #######
# Output directories for processed files (will be created if it doesn't exist)
output_folder: $TUTORIAL_DATA_PATH/output/tutorial_NW_atlantic_parallel/out_obs_seq_in/
input_nml_bck: $TUTORIAL_DATA_PATH/output/tutorial_NW_atlantic_parallel/input_bckp/
trimmed_obs_folder: $TUTORIAL_DATA_PATH/output/tutorial_NW_atlantic_parallel/out_trimmed_obs_seq_in/
parquet_folder: $TUTORIAL_DATA_PATH/output/tutorial_NW_atlantic_parallel/out_parquet/
tmp_folder: $TUTORIAL_DATA_PATH/output/tutorial_NW_atlantic_parallel/tmp/

####### DART #######
# Path to DART's perfect model obs executable
perfect_model_obs_dir: $DART_ROOT_PATH/models/MOM6/work  #CASPER

# Observation types to interpolate to (can include ALL_<FIELD> entries)
use_these_obs:
   - ALL_TEMPERATURE           # Includes ALL temperature types
   - ALL_SALINITY              # Includes ALL temperature types
#   - ARGO_TEMPERATURE          # Include measurements marked as Argo float temperature
#   - ARGO_SALINITY            # Include measurements marked as Argo float salinity

# Time window for matching observations to model output
time_window:
  days: 1      # Primary time window in days
  hours: 0     # Additional hours
  minutes: 0   # Additional minutes
  seconds: 0   # Additional seconds
  weeks: 0     # Additional weeks
  months: 0    # Additional months (30 days/month)
  years: 0     # Additional years (365 days/year)

# MOM6 variable naming and type
model_state_variables:
  so: QTY_SALINITY
  thetao: QTY_POTENTIAL_TEMPERATURE

# Use pseudo-depth for vertical interpolation (required when layer thickness 'h'
# is not included in model_state_variables; set to false only if you explicitly
# add 'h: QTY_LAYER_THICKNESS' to model_state_variables above)
use_pseudo_depth: true

layer_name: zl

####### LOGGING #######
# model2obs writes concise progress to screen and detailed diagnostics to a run log.
# Default (if unset): <output_folder>/model2obs.log
# Optional override example (full path):
log_file: $TUTORIAL_DATA_PATH/output/tutorial_NW_atlantic_parallel/logs/model2obs.log


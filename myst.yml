version: 1
project:
  title: CROCOGallery
  github: CROCODILE-CESM/CrocoGallery
  parts:
    banner: |
      <strong>Using CROCODILE tools?</strong> Tell us about your project in a
      [2-minute form](https://forms.gle/UsgxpqCTyHGn4sLJ9).
  bibliography:
    - static/references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: README.md

    - file: crocodash/index.md
      children:
        - file: crocodash/tutorial-ocn.ipynb
          title: Getting Started
          children:
            - file: crocodash/tutorial-ocn-wav.ipynb
              title: Ocean + Waves
            - file: crocodash/tutorial-ocn-wav-ice.ipynb
              title: Ocean + Waves + Sea Ice
        - file: crocodash/grids.ipynb
        - file: crocodash/bathymetry.ipynb
        - file: crocodash/case_setup.ipynb
        - file: crocodash/configure_forcings.ipynb
        - file: crocodash/process_forcings.ipynb
        - title: Advanced
          children:
            - file: crocodash/advanced/nesting_demo.ipynb
            - file: crocodash/advanced/interior_obc_segments.ipynb
            - file: crocodash/advanced/cli_workflow.md
        - title: Use Cases
          children:
            - file: crocodash/use_cases/three_boundary_from_t232.ipynb
            - file: crocodash/use_cases/three_boundary.ipynb
            - file: crocodash/use_cases/mom6_cice_antarctica.ipynb
        - file: crocodash/projects/index.md
          title: Projects
          children:
            - file: crocodash/projects/ocean_only.ipynb
            - file: crocodash/projects/cice.ipynb
            - file: crocodash/projects/ww3.ipynb
            - file: crocodash/projects/marbl.ipynb
            - file: crocodash/projects/KitchenSink.ipynb
            - file: crocodash/projects/bering_diagnostics.ipynb
              title: Bering Sea Diagnostics

    - file: mom6_tools.md
      title: mom6-tools

    - file: model2obs/index.md
      children:
        - file: model2obs/tutorial_MOM6-CL-comparison-Hawaii.ipynb
          title: Comparing MOM6 output to in-situ observations (small domain, serial)
        - file: model2obs/tutorial_MOM6-CL-comparison-NWA-parallel.ipynb
          title: Comparing MOM6 output to in-situ observations (large domain, parallel)
        - file: model2obs/tutorial_CrocoLake_map_temperature.ipynb
          title: Visualizing CrocoLake and working with larger-than-memory datasets
        - title: Model-Observation Comparison Examples
          children:
            - file: model2obs/CARIB12_EKE_TS.ipynb
              title: CARIB12 EKE Analysis

    - file: dart/index.md
      children:
        - file: dart/tutorial1_real_observations.ipynb
          title: Preparing Real Observations
        - file: dart/tutorial2_synthetic_observations.ipynb
          title: Creating Synthetic Observations
        - file: dart/tutorial3_cycling_dart_cesm.ipynb
          title: Cycling DART-CESM

site:
  options:
    logo: static/long_crocodile.png
    folders: true
    favicon: static/crocodile.png
    style: static/custom.css
  template: book-theme

# CrocoDash starter case config
# Edit this file, then run: crocodash create --config <this_file>
# Tip: run `crocodash dump --caseroot PATH` on an existing case to generate a config.

# ── Grid files ───────────────────────────────────────────────────────────────
# The case names its grid files (ocn_grid, ocn_topo and ocn_vgrid below).
# Write them once with mom6_forge, through CrocoDash, e.g. in Python:
#
#   from CrocoDash.grid import Grid
#   from CrocoDash.topo import Topo
#   from CrocoDash.vgrid import VGrid
#
#   grid = Grid(lenx=3.0, leny=3.0, xstart=278.0, ystart=7.0, resolution=0.1, name="my_case")
#   grid.write_supergrid("ocean_hgrid.nc")
#   topo = Topo(grid, min_depth=9.5)
#   topo.set_flat(5000.0)   # or topo.set_from_dataset(bathymetry_path="<GEBCO>", ...)
#   topo.write_topo("ocean_topog.nc")
#   VGrid.uniform(nk=75, depth=topo.max_depth).write("ocean_vgrid.nc")
#
# Any existing case's grid files work too: `crocodash dump` names them.

# ── CESM case ─────────────────────────────────────────────────────────────────
case:
  cesmroot: <CESM>
  caseroot: <casedir>/my_case
  inputdir: <inputdir>/my_case
  compset: "1850_DATM%JRA_SLND_SICE_MOM6%REGIONAL_SROF_SGLC_SWAV"
  ocn_grid: /path/to/ocean_hgrid.nc
  ocn_topo: /path/to/ocean_topog.nc
  ocn_vgrid: /path/to/ocean_vgrid.nc
  machine: derecho
  project: YOUR_PROJECT    # HPC allocation (e.g. ncgd0011)
  atm_grid_name: TL319     # atmospheric grid; TL319 ≈ 0.5° resolution

  # optional CESM tuning:
  # rof_grid_name: null
  # ninst: 1
  # ntasks_ocn: null
  # job_queue: main
  # job_wallclock_time: "01:00:00"

# ── Forcings ───────────────────────────────────────────────────────
# Leave this section out and `crocodash create` asks for the forcings on a terminal.
forcings:
  date_range: ["2020-01-01 00:00:00", "2020-12-31 00:00:00"]
  boundaries: [north, south, east, west]
  product_name: GLORYS
  function_name: get_glorys_data_from_rda

  # Tidal forcing (optional):
  # tidal_constituents: [M2, S2, K1, O1]
  # tpxo_elevation_filepath: <TPXO_H>
  # tpxo_velocity_filepath: <TPXO_U>

  # BGC initial conditions (optional):
  # marbl_ic_filepath: <MARBL_IC>

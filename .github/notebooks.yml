# Single source of truth for CrocoDash notebook CI coverage.
# Every notebook under crocodash/ must appear in either 'run' or 'skip'.
# The check_notebook_coverage.sh script enforces this.
# The run_notebooks.yml CI matrix is generated dynamically from 'run'.

run:
  - crocodash/tutorial-ocn.ipynb             # process_forcings() cell tagged ci-skip
  - crocodash/tutorial-ocn-wav.ipynb         # process_forcings() cell tagged ci-skip
  - crocodash/tutorial-ocn-wav-ice.ipynb     # process_forcings() cell tagged ci-skip
  - crocodash/grids.ipynb                    # widget + polar-projection cells tagged ci-skip
  - crocodash/bathymetry.ipynb               # TopoEditor widget cell tagged ci-skip
  - crocodash/case_setup.ipynb               # Case() construction cells tagged ci-skip; registry-discovery cells run
  - crocodash/configure_forcings.ipynb       # configure_forcings() calls tagged ci-skip; ProductRegistry cells run
  - crocodash/process_forcings.ipynb         # process_forcings() cells tagged ci-skip; Section 2 is markdown-only
  - crocodash/advanced/interior_obc_segments.ipynb
  - crocodash/use_cases/three_boundary_from_t232.ipynb

skip:
  - path: crocodash/projects/ocean_only.ipynb
    reason: >-
      Workshop project: a full grid/case/forcing walkthrough that creates a real
      CESM case. Move it to 'run' once its Case() and process_forcings() cells
      carry ci-skip tags.
  - path: crocodash/projects/cice.ipynb
    reason: >-
      Workshop project: creates a real CESM case and runs process_forcings for
      its extra components, too heavy for the nightly matrix. Move it to 'run'
      once those cells carry ci-skip tags.
  - path: crocodash/projects/ww3.ipynb
    reason: >-
      Workshop project: creates a real CESM case and runs process_forcings for
      its extra components, too heavy for the nightly matrix. Move it to 'run'
      once those cells carry ci-skip tags.
  - path: crocodash/projects/marbl.ipynb
    reason: >-
      Workshop project: creates a real CESM case and runs process_forcings for
      its extra components, too heavy for the nightly matrix. Move it to 'run'
      once those cells carry ci-skip tags.
  - path: crocodash/projects/KitchenSink.ipynb
    reason: >-
      Workshop project: creates a real CESM case and runs process_forcings for
      its extra components, too heavy for the nightly matrix. Move it to 'run'
      once those cells carry ci-skip tags.
  - path: crocodash/use_cases/mom6_cice_antarctica.ipynb
    reason: Bathymetry regridding OOM; needs ci-skip cell tags added first
  - path: crocodash/use_cases/three_boundary.ipynb
    reason: Superseded by three_boundary_from_t232.ipynb for CI; too expensive to run both
  - path: crocodash/advanced/nesting_demo.ipynb
    reason: >-
      Hardcodes a personal /glade/derecho/scratch GEBCO path; the
      visualization step depends on ~/scratch/archive/gibraltar_* output from
      a prior manual 3-domain run, not reproducible headlessly. Needs
      known_paths.json entries and a rewritten visualization step (or
      pre-staged CI fixtures) before it can run in CI.
